$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Register page
status: stable
description: >
  Visual shell for the real AccountRegisterForm (journalist / CFC member
  registration). The form itself is a slot — rendered by Drupal Form API,
  not by this component.
props:
  type: object
  properties:
    home_url:
      type: string
    sign_in_url:
      type: string
    logo_url:
      type: string
    initial_type:
      type: string
      description: 'Pre-selects "journalist" or "cfc_member" and skips the card picker — used when returning here from "Change email address" on the verify-email page.'
  required:
    - home_url
    - sign_in_url
    - logo_url
slots:
  form:
    type: string
    description: The rendered AccountRegisterForm.
