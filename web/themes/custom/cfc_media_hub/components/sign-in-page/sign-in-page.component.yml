$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Sign-in page
status: stable
description: >
  Sign-in page. Posts to Drupal core's real user.login route (genuine
  authentication), styled to match the design. "Forgot password?" links out
  to the dedicated forgot-password-page component/route.
props:
  type: object
  properties:
    login_action:
      type: string
    login_form_build_id:
      type: string
    create_account_url:
      type: string
    forgot_password_url:
      type: string
    home_url:
      type: string
    logo_url:
      type: string
  required:
    - login_action
    - login_form_build_id
    - create_account_url
    - forgot_password_url
    - home_url
    - logo_url
