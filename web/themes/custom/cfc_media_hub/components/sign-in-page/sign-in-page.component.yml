$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Sign-in page
status: stable
description: >
  Sign-in page, wrapping Drupal core's real login form (genuine
  authentication) in the custom design. The "Forgot password?" link and
  show/hide toggle are added onto that real form by
  cfc_account_form_user_login_form_alter() — not reconstructed here — so a
  failed login re-displays correctly inside this page instead of falling
  through to core's unstyled /user/login error page.
props:
  type: object
  properties:
    create_account_url:
      type: string
    home_url:
      type: string
    logo_url:
      type: string
  required:
    - create_account_url
    - home_url
    - logo_url
slots:
  form:
    type: string
    description: The rendered Drupal core UserLoginForm.
