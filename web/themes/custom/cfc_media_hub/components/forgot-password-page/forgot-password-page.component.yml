$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Forgot password page
status: stable
description: >
  Visual shell for the real ForgotPasswordRequestForm (6-digit code request).
  The form itself is a slot — rendered by Drupal Form API, not by this
  component.
props:
  type: object
  properties:
    home_url:
      type: string
    sign_in_url:
      type: string
    logo_url:
      type: string
  required:
    - home_url
    - sign_in_url
    - logo_url
slots:
  form:
    type: string
    description: The rendered ForgotPasswordRequestForm.
