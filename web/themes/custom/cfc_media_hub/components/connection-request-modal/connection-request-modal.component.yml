$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Connection request modal
status: stable
description: >
  Modal shell for submitting a connection request (CFCA / CFC Member /
  another organisation). Expects an ancestor Alpine scope exposing a boolean
  "open" variable that controls visibility. The actual form — cards, fields,
  validation, AJAX submit and backoffice storage — is
  Drupal\cfc_connections\Form\ConnectionRequestForm, passed in as a prop.
props:
  type: object
  properties:
    connection_form:
      type: object
      description: Render array of Drupal\cfc_connections\Form\ConnectionRequestForm.
  required:
    - connection_form
