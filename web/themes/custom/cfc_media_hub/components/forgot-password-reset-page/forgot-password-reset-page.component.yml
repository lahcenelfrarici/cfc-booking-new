$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Forgot password - new password page
status: stable
description: >
  "New password" — step 3 of the forgot-password flow, wrapping the real
  ResetPasswordForm.
props:
  type: object
  properties:
    home_url:
      type: string
    sign_in_url:
      type: string
    logo_url:
      type: string
  required:
    - home_url
    - sign_in_url
    - logo_url
slots:
  form:
    type: string
    description: The rendered ResetPasswordForm.
