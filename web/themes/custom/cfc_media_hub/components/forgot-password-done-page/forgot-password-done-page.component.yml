$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Forgot password - done page
status: stable
description: >
  "Password updated." — step 4, static confirmation shown after a
  successful reset. No form — just a link back to sign-in.
props:
  type: object
  properties:
    home_url:
      type: string
    sign_in_url:
      type: string
    logo_url:
      type: string
  required:
    - home_url
    - sign_in_url
    - logo_url
