$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Forgot password - verify code page
status: stable
description: >
  "Check your email" — step 2 of the forgot-password flow, wrapping the real
  VerifyResetCodeForm (6-digit code entry).
props:
  type: object
  properties:
    home_url:
      type: string
    sign_in_url:
      type: string
    logo_url:
      type: string
    email:
      type: string
  required:
    - home_url
    - sign_in_url
    - logo_url
    - email
slots:
  form:
    type: string
    description: The rendered VerifyResetCodeForm.
