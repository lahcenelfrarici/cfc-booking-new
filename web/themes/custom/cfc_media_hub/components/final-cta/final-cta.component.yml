$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Final CTA
status: stable
description: Homepage closing CTA band with a "next available slots" mini widget.
props:
  type: object
  properties:
    booking_base_url:
      type: string
    slots:
      type: object
      description: >
        Real next-available-slot data keyed by space id, from
        HomeController::buildNextSlots() — each entry has title, day_label,
        time_range, book_url (direct booking link for an eligible logged-in
        user, otherwise the manual /booking?space=X fallback).
  required:
    - booking_base_url
    - slots
