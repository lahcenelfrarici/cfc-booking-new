$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Produced by the Hub
status: stable
description: Production/Ecosystem page — recent content grid. Data comes from real "Production" content type nodes.
props:
  type: object
  properties:
    productions:
      type: array
      description: Array of Production nodes, mapped by Drupal\cfc_content\ContentRepository::getProductions(). Each item includes its own detail "url".
  required:
    - productions
