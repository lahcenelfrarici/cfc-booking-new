cfc_booking.cancel:
  path: '/booking/{node}/cancel'
  defaults:
    _controller: '\Drupal\cfc_booking\Controller\CancelBookingController::build'
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_token: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node

cfc_booking.quick_book:
  path: '/booking/quick/{space}/{date}/{time}/{duration}'
  defaults:
    _controller: '\Drupal\cfc_booking\Controller\QuickBookController::build'
    _title: 'Book'
  requirements:
    _access: 'TRUE'

cfc_booking.review:
  path: '/booking/{node}/review'
  defaults:
    _controller: '\Drupal\cfc_booking\Controller\ReviewController::build'
    _title: 'Review your reservation'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node

cfc_booking.confirmation:
  path: '/booking/{node}/confirmation'
  defaults:
    _controller: '\Drupal\cfc_booking\Controller\ConfirmationController::build'
    _title: 'Reservation confirmed'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node
